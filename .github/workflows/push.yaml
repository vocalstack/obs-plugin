name: Push
run-name: ${{ github.ref_name }} push run 🚀
on:
  push:
    branches:
      - master
      - main
      - 'release/**'
    tags:
      - '*'
      - '!latest' # latest is moved by a release, below
permissions:
  contents: write
# A newer push to the same branch cancels the run it replaces.
concurrency:
  group: push-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  build-project:
    name: Build Project 🧱
    uses: ./.github/workflows/build-project.yaml
    secrets: inherit
    permissions:
      contents: read

  create-release:
    name: Create Release 🛫
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build-project
    defaults:
      run:
        shell: bash
    steps:
      - name: Check Release Tag ☑️
        id: check
        run: |
          : Check Release Tag ☑️
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob

          case "${GITHUB_REF_NAME}" in
            +([0-9]).+([0-9]).+([0-9]) )
              echo 'validTag=true' >> $GITHUB_OUTPUT
              echo 'prerelease=false' >> $GITHUB_OUTPUT
              echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
              ;;
            +([0-9]).+([0-9]).+([0-9])-@(beta|rc)*([0-9]) )
              echo 'validTag=true' >> $GITHUB_OUTPUT
              echo 'prerelease=true' >> $GITHUB_OUTPUT
              echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
              ;;
            *) echo 'validTag=false' >> $GITHUB_OUTPUT ;;
          esac

      - uses: actions/checkout@v4
        if: fromJSON(steps.check.outputs.validTag)
        with:
          path: repo
          sparse-checkout: |
            .github/release-notes.md
            VERSION
          sparse-checkout-cone-mode: false

      # The tag is the version: VERSION is bumped and committed, then the same
      # version tagged and pushed (as VocalStack for Mac).
      - name: Check VERSION ☑️
        if: fromJSON(steps.check.outputs.validTag)
        run: |
          version="$(tr -d '[:space:]' < repo/VERSION)"
          [ "${GITHUB_REF_NAME}" = "${version}" ] || { echo "::error::tag ${GITHUB_REF_NAME} does not match VERSION ${version}"; exit 1; }

      - name: Download Build Artifacts 📥
        uses: actions/download-artifact@v4
        if: fromJSON(steps.check.outputs.validTag)
        id: download

      - name: Rename Files 🏷️
        if: fromJSON(steps.check.outputs.validTag)
        run: |
          : Rename Files 🏷️
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob
          shopt -s nullglob

          root_dir="$(pwd)"
          commit_hash="${GITHUB_SHA:0:9}"

          variants=(
            'windows-x64;zip|exe'
            'macos-universal;tar.xz|pkg'
            'ubuntu-24.04-x86_64;tar.xz|deb|ddeb'
            'sources;tar.xz'
          )

          for variant_data in "${variants[@]}"; do
            IFS=';' read -r variant suffix <<< "${variant_data}"

            candidates=(*-${variant}-${commit_hash}/@(*|*-dbgsym).@(${suffix}))

            for candidate in "${candidates[@]}"; do
              mv "${candidate}" "${root_dir}"
            done
          done

          # Fixed names, so releases/latest/download/<name> (the website's
          # download links) always fetches the newest.
          mv *-windows-x64.zip vocalstack-obs-windows-x64.zip
          mv *-macos-universal.pkg vocalstack-obs-macos.pkg
          mv *-x86_64-linux-gnu.deb vocalstack-obs-linux-x86_64.deb
          mv *-source.tar.xz vocalstack-obs-source.tar.xz

      - name: Generate Checksums 🪪
        if: fromJSON(steps.check.outputs.validTag)
        run: |
          : Generate Checksums 🪪
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob

          cp repo/.github/release-notes.md ${{ github.workspace }}/CHECKSUMS.txt
          echo "### Checksums (SHA-256)" >> ${{ github.workspace }}/CHECKSUMS.txt
          for file in ${{ github.workspace }}/vocalstack-obs-@(*.deb|*.pkg|*.tar.xz|*.zip); do
            echo "    ${file##*/}: $(sha256sum "${file}" | cut -d " " -f 1)" >> ${{ github.workspace }}/CHECKSUMS.txt
          done

      - name: Create Release 🛫
        if: fromJSON(steps.check.outputs.validTag)
        id: create_release
        uses: softprops/action-gh-release@9d7c94cfd0a1f3ed45544c887983e9fa900f0564
        with:
          draft: false
          prerelease: ${{ fromJSON(steps.check.outputs.prerelease) }}
          tag_name: ${{ steps.check.outputs.version }}
          name: VocalStack for OBS ${{ steps.check.outputs.version }}
          body_path: ${{ github.workspace }}/CHECKSUMS.txt
          files: |
            ${{ github.workspace }}/vocalstack-obs-windows-x64.zip
            ${{ github.workspace }}/vocalstack-obs-macos.pkg
            ${{ github.workspace }}/vocalstack-obs-linux-x86_64.deb
            ${{ github.workspace }}/vocalstack-obs-source.tar.xz

      # The `latest` release follows each version, so its links never change
      # (the website's downloads come from it):
      #   https://github.com/vocalstack/obs-plugin/releases/download/latest/vocalstack-obs-macos.pkg
      - name: Refresh the latest release
        if: fromJSON(steps.check.outputs.validTag) && !fromJSON(steps.check.outputs.prerelease)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          files=(vocalstack-obs-windows-x64.zip vocalstack-obs-macos.pkg vocalstack-obs-linux-x86_64.deb vocalstack-obs-source.tar.xz)
          notes="VocalStack for OBS $tag (built from ${GITHUB_SHA::12}). Moves to each new version."
          # GitHub's release API answers a 5xx now and then: try each call a few times.
          retry() { for i in 1 2 3 4; do "$@" && return 0; echo "retry $i: $*"; sleep $((i * 10)); done; "$@"; }
          if gh release view latest -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Move the tag, then swap the files in place: the links stay the same.
            retry gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            retry gh release upload latest "${files[@]}" -R "$GITHUB_REPOSITORY" --clobber
            retry gh release edit latest -R "$GITHUB_REPOSITORY" --title "VocalStack for OBS $tag (latest)" --notes "$notes" --latest=false
          else
            gh release create latest "${files[@]}" -R "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --latest=false --title "VocalStack for OBS $tag (latest)" --notes "$notes"
          fi
